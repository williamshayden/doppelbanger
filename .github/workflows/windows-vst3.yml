name: Windows VST3

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: windows-vst3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-foundation:
    name: Native x64 VST3 foundation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Rust format
        shell: powershell
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rust clippy
        shell: powershell
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rust tests
        shell: powershell
        run: |
          $evidence = 'var\validation\native-foundation'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $callerErrorActionPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $report = & cargo test --locked --all-targets 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $callerErrorActionPreference
          }
          $report | Set-Content -LiteralPath "$evidence\rust-tests.txt" -NoNewline
          $report
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Dependency contract
        shell: powershell
        run: |
          cmake -P tests/cmake/dependency_contract.cmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validation wrapper contract
        shell: powershell
        run: |
          powershell.exe -NoProfile -File .\tests\tooling\validation_wrapper_contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Developer entrypoint contract
        shell: powershell
        run: |
          powershell.exe -NoProfile -File .\tests\tooling\dev_entrypoint_contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure Release VST3
        shell: powershell
        run: |
          cmake --preset windows-msvc-x64-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure pinned validator
        shell: powershell
        run: |
          cmake -S third_party/vst3sdk -B build/windows-vst3-validator -G Ninja -DCMAKE_BUILD_TYPE=Release -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_RUN_VST_VALIDATOR=OFF -DSMTG_CREATE_PLUGIN_LINK=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Release VST3
        shell: powershell
        run: |
          cmake --build --preset windows-msvc-x64-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build pinned validator
        shell: powershell
        run: |
          cmake --build build/windows-vst3-validator --target validator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native CTest report
        shell: powershell
        run: |
          $evidence = 'var\validation\native-foundation'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $callerErrorActionPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $report = & ctest --preset windows-msvc-x64-release 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $callerErrorActionPreference
          }
          $report | Set-Content -LiteralPath "$evidence\ctest.txt" -NoNewline
          $report
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Steinberg VST3 validator
        shell: powershell
        run: |
          $repo = (Get-Location).Path
          powershell.exe -NoProfile -File .\tests\plugin\validate_vst3.ps1 `
            -ValidatorPath (Join-Path $repo 'build\windows-vst3-validator\bin\validator.exe') `
            -PluginPath (Join-Path $repo 'build\windows-msvc-x64-release\artefacts\Release\VST3\Doppelbanger.vst3') `
            -EvidenceDirectory (Join-Path $repo 'var\validation\native-foundation') `
            -TimeoutSeconds 120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare sanitized CI evidence
        shell: powershell
        run: |
          $repo = (Get-Location).Path
          $source = Join-Path $repo 'var\validation\native-foundation'
          $destination = Join-Path $source 'ci'
          $bundle = Join-Path $repo 'build\windows-msvc-x64-release\artefacts\Release\VST3\Doppelbanger.vst3'
          $module = Join-Path $bundle 'Contents\x86_64-win\Doppelbanger.vst3'
          $webRoot = Join-Path $bundle 'Contents\Resources\web'
          $webAssetContract = Join-Path $repo 'tests\tooling\web_asset_contract.ps1'
          $reports = @(
            'rust-tests.txt',
            'ctest.txt',
            'validator.stdout.txt',
            'validator.stderr.txt',
            'validator.result.json'
          )
          if (-not (Test-Path -LiteralPath $module -PathType Leaf)) {
            throw "missing exact VST3 module: $module"
          }
          if (-not (Test-Path -LiteralPath $webRoot -PathType Container)) {
            throw "missing exact VST3 web root: $webRoot"
          }
          powershell.exe -NoProfile -File $webAssetContract -WebRoot $webRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $moduleFullPath = [System.IO.Path]::GetFullPath($module)
          $webRootFullPath = [System.IO.Path]::GetFullPath($webRoot).TrimEnd(
            [System.IO.Path]::DirectorySeparatorChar,
            [System.IO.Path]::AltDirectorySeparatorChar
          )
          $webRootPrefix = $webRootFullPath + [System.IO.Path]::DirectorySeparatorChar
          $bundleFiles = @(Get-ChildItem -LiteralPath $bundle -Recurse -File)
          $webFileCount = 0
          foreach ($bundleFile in $bundleFiles) {
            $fileFullPath = [System.IO.Path]::GetFullPath($bundleFile.FullName)
            if ([string]::Equals($fileFullPath, $moduleFullPath, [StringComparison]::OrdinalIgnoreCase)) {
              continue
            }
            if ($fileFullPath.StartsWith($webRootPrefix, [StringComparison]::OrdinalIgnoreCase)) {
              $webFileCount++
              continue
            }
            throw "unexpected VST3 bundle file: $fileFullPath"
          }
          if ($webFileCount -eq 0) {
            throw 'the unsigned VST3 bundle must contain validated web files'
          }
          foreach ($report in $reports) {
            $reportPath = Join-Path $source $report
            if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
              throw "missing required CI report: $report"
            }
          }
          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $rawWorkspace = [System.IO.Path]::GetFullPath($repo).TrimEnd('\')
          $escapedWorkspace = $rawWorkspace.Replace('\', '\\')
          $encoding = New-Object System.Text.UTF8Encoding($false)
          foreach ($report in $reports) {
            $content = [System.IO.File]::ReadAllText((Join-Path $source $report))
            $content = $content.Replace($escapedWorkspace, '<workspace>')
            $content = $content.Replace($rawWorkspace, '<workspace>')
            if ($content.Contains($rawWorkspace) -or $content.Contains($escapedWorkspace)) {
              throw "workspace path survived sanitization in $report"
            }
            [System.IO.File]::WriteAllText((Join-Path $destination $report), $content, $encoding)
          }
          $stagedReports = @(Get-ChildItem -LiteralPath $destination -File | Select-Object -ExpandProperty Name)
          if (@(Compare-Object -ReferenceObject $reports -DifferenceObject $stagedReports).Count -ne 0) {
            throw 'staged CI reports differ from the explicit allowlist'
          }
          foreach ($report in $reports) {
            $stagedContent = [System.IO.File]::ReadAllText((Join-Path $destination $report))
            if ($stagedContent.Contains($rawWorkspace) -or $stagedContent.Contains($escapedWorkspace)) {
              throw "workspace path remains in staged report $report"
            }
          }
      - name: Require clean checkout
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $status = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($status.Count -ne 0) { throw 'generated output or source changes remain after the native gate' }
      - name: Upload unsigned VST3 and reports
        uses: actions/upload-artifact@v7
        with:
          name: doppelbanger-windows-vst3
          if-no-files-found: error
          path: |
            build/windows-msvc-x64-release/artefacts/Release/VST3/Doppelbanger.vst3
            var/validation/native-foundation/ci
